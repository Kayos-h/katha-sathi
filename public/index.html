<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Khata Sathi - your bills, your khata, one place.">
<title>Khata Sathi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LANDING PAGE ============ -->
<div id="landing" class="landing-wrap hidden"></div>

<!-- ============ AUTH SCREENS ============ -->
<div id="auth" class="auth-wrap hidden">
  <div class="auth-card" id="auth-card"><!-- setup / login rendered here --></div>
  <p class="auth-foot">Khata Sathi · your bills, your khata</p>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">

  <!-- Sidebar (desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">K</div>
      <div class="brand-name">Khata Sathi</div>
      <div class="brand-sub" id="brand-store"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="side-btn" id="btn-qr-side" title="Connect phone">
        <span class="ico" data-icon="qr"></span><span>Connect phone</span>
      </button>
      <button class="side-btn" id="btn-theme-side" title="Theme">
        <span class="ico" data-icon="moon"></span><span id="theme-label">Dark mode</span>
      </button>
      <div class="side-user" id="side-user"></div>
      <button class="side-btn subtle" id="btn-logout">
        <span class="ico" data-icon="out"></span><span>Sign out</span>
      </button>
    </div>
  </aside>

  <!-- Topbar -->
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btn-back" title="Back">
      <span class="ico" data-icon="back"></span>
    </button>
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-search" id="topbar-search">
      <span class="ico" data-icon="search"></span>
      <input id="global-search" placeholder="Search people…" autocomplete="off">
      <div class="search-pop" id="search-pop"></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-qr" title="Connect phone">
        <span class="ico" data-icon="qr"></span>
      </button>
      <button class="icon-btn" id="btn-theme" title="Theme">
        <span class="ico" data-icon="moon"></span>
      </button>
    </div>
  </header>

  <!-- Main views -->
  <main class="main" id="main"></main>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<!-- Toasts -->
<div id="toasts" class="toasts"></div>
<!-- Modal root -->
<div id="modal-root"></div>
<!-- Lightbox -->
<div id="lightbox" class="lightbox hidden"><img id="lightbox-img" alt="Bill photo"></div>

<script src="util.js"></script>
<script src="api.js"></script>
<script src="views/dashboard.js"></script>
<script src="views/people.js"></script>
<script src="views/bill.js"></script>
<script src="views/billmaker.js"></script>
<script src="views/ledger.js"></script>
<script src="views/inventory.js"></script>
<script src="views/landing.js"></script>
<script src="views/galla.js"></script>
<script src="views/payment.js"></script>
<script src="views/activity.js"></script>
<script src="views/settings.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () { /* offline install is best-effort */ });
  }
</script>
</body>
</html>
